# Builds a complete Voile release from a clean checkout of main and drafts it
# on GitHub: the runtime archive, with the Linux engine in its linux folder, and
# its SHA-256. Each submodule first moves to the latest commit of its main, and
# that move is committed to main, so the release's commit names what it built.
# Run it from the Actions tab with the version. Publish the draft by hand once
# it is checked; publishing creates the tag on the packaged commit. The Beta
# workflow builds betas with it, such as v26.3.0-26.beta1, and publishes them
# at once as pre-releases, with the commits since the tag `since` as notes.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, v<CrossOver version>-<revision>, such as v26.3.0-14
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Beta version, v<CrossOver version>-<revision>.beta<n>
        required: true
        type: string
      since:
        description: The tag the beta's notes start from
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  runtime:
    # Apple silicon on macOS 27, as Obelisk's releases; Rosetta runs the
    # x86_64 Wine that package.sh checks the archive with.
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      VERSION: ${{ inputs.version }}
      SINCE: ${{ inputs.since }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run the release from main: it commits the submodules' new commits there."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+(\.beta[0-9]+)?$ ]]; then
            echo "::error::$VERSION is not v<CrossOver version>-<revision>, such as v26.3.0-14."
            exit 1
          fi
          if [[ "$VERSION" == *.beta* && -z "$SINCE" ]]; then
            echo "::error::Only the Beta workflow builds betas."
            exit 1
          fi
          if gh release view "$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release $VERSION already exists."
            exit 1
          fi
          if [[ "$VERSION" == *.beta* ]]; then
            # A deleted release leaves its tag, which publishing would refuse after hours of building; exit code 2
            # alone means GitHub has no such tag.
            status=0
            git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$VERSION" \
              > /dev/null || status=$?
            if [[ "$status" != 2 ]]; then
              echo "::error::A tag $VERSION already exists, or GitHub could not say."
              exit 1
            fi
            # A beta of a revision already released would reach no player.
            if gh release view "${VERSION%.beta*}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::${VERSION%.beta*} is already released."
              exit 1
            fi
          fi

      # main as it is now, not as it was when the run was queued: the build commits on top of it. A beta's notes
      # read the history since the tag `since`.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check out the submodules at their main
        run: |
          # .gitmodules names each submodule's branch. Their own submodules (FEX in voile-lkd, the DirectX
          # headers in DXMT) stay on the commits those repositories pin.
          git submodule update --init --remote --depth 1 wine voile-lkd neptune dxmt
          # FEX's test binaries (800 MB) and DXMT's NVAPI stay out: the build doesn't use them.
          git -C dxmt submodule update --init --depth 1 include/native/directx
          git -C voile-lkd submodule update --init --depth 1 fex
          for bins in fex-gcc-target-tests-bins fex-gvisor-tests-bins fex-posixtest-bins; do
            git -C voile-lkd/fex config "submodule.External/$bins.update" none
          done
          git -C voile-lkd/fex submodule update --init --recursive --depth 1
          git submodule status --recursive

      - name: Commit the submodules' new commits
        run: |
          moved=()
          for module in wine voile-lkd neptune dxmt; do
            old="$(git rev-parse "HEAD:$module")" new="$(git -C "$module" rev-parse HEAD)"
            [[ "$old" == "$new" ]] || moved+=("$module ${old:0:12}..${new:0:12}")
          done
          if (( ${#moved[@]} )); then
            git config user.name Zagrios
            git config user.email 40181755+Zagrios@users.noreply.github.com
            git commit --quiet -m "Build $VERSION from the submodules' main" -m "$(printf '%s\n' "${moved[@]}")" \
              wine voile-lkd neptune dxmt
            # Feed may have committed to main since the checkout.
            for attempt in 1 2 3 4 5; do
              git pull --quiet --rebase origin main && git push origin HEAD:main && break
              [[ "$attempt" -lt 5 ]] || exit 1
              sleep 10
            done
            # A submodule someone else moved meanwhile builds as main now pins it.
            git submodule update --depth 1 wine voile-lkd neptune dxmt
          fi
          git log -1 --format='%h %s'

      - name: Install the build tools
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null ||
            sudo softwareupdate --install-rosetta --agree-to-license
          brew install bison meson ninja pkgconf llvm@15 zstd xz
          # DXMT compiles its Metal shaders with Xcode's Metal toolchain.
          xcodebuild -downloadComponent MetalToolchain
          # Neptune's meson needs mako, PyYAML and packaging (Mesa compares versions with it, and Python 3.12 has
          # no distutils left to fall back on), and voile-lkd cmake, from the PATH.
          python3 -m venv build/pyenv
          build/pyenv/bin/pip install --quiet mako pyyaml packaging cmake
          df -h "$GITHUB_WORKSPACE"

      - uses: actions/cache@v4
        with:
          path: build/downloads
          key: voile-downloads-${{ hashFiles('sources.json') }}
          restore-keys: voile-downloads-

      # What build.sh installs before Wine (FreeType, GnuTLS, GStreamer and LLVM, half an hour of the build) rarely
      # changes between releases. Each stamp names its step's inputs: build.sh skips the step while they match,
      # and rebuilds it from scratch otherwise.
      - uses: actions/cache@v4
        with:
          path: |
            build/deps
            build/stamps/freetype
            build/stamps/gnutls
            build/stamps/gstreamer
            build/stamps/llvm
          key: voile-deps-${{ hashFiles('sources.json', 'scripts/build.sh', 'patches/**') }}
          restore-keys: voile-deps-

      - name: Build and package
        run: PATH="$PWD/build/pyenv/bin:$PATH" ./scripts/package.sh "$VERSION"

      - name: Draft the release, or publish the beta
        run: |
          if [[ "$VERSION" != *.beta* ]]; then
            ./scripts/publish.sh "$VERSION" --draft
            exit 0
          fi
          ./scripts/beta.sh --notes "$SINCE" > "$RUNNER_TEMP/notes.md"
          ./scripts/publish.sh "$VERSION" "$RUNNER_TEMP/notes.md"

      - name: Show the disk space left
        if: always()
        run: df -h "$GITHUB_WORKSPACE"

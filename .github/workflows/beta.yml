# Every two hours, builds a beta of Voile when main, or the main of a
# submodule, changed since the highest version published, release or beta,
# beyond the files a build never reads (scripts/beta.sh names them). The beta
# continues the newest beta's revision, else takes the next revision's first
# number, such as v26.3.0-26.beta1 after v26.3.0-25, and is published at once
# as a pre-release with the commits since as notes, then offered in the feed:
# only players who take beta versions in Obelisk get it. A beta whose build failed is built again once
# something changed. Run it from the Actions tab to check now, or to build
# again after a failure.
name: Beta

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.decide.outputs.due }}
      version: ${{ steps.decide.outputs.version }}
      since: ${{ steps.decide.outputs.since }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Look for changes since the newest release or beta
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ./scripts/beta.sh | tee -a "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.due == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.decide.outputs.version }}
      since: ${{ needs.decide.outputs.since }}

  # A release made with the workflow's own token starts no workflow.
  feed:
    needs: [decide, build]
    uses: ./.github/workflows/feed.yml
    with:
      version: ${{ needs.decide.outputs.version }}
    secrets: inherit
